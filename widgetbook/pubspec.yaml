name: flux_card_widgetbook
version: 0.0.2+1
description: Widgetbook project for the flux_card package using build_runner and annotations.
publish_to: 'none'

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flux_card:
    path: ../
  widgetbook: ^3.22.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  widgetbook_generator: ^3.22.0

flutter:
  uses-material-design: true
