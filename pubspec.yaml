name: flux_card
description: >-
  A constraint-aware, domain-agnostic, composition-first card layout engine for Flutter.
version: 0.2.0

homepage: https://github.com/puntbyte/flux_card
repository: https://github.com/puntbyte/flux_card
issue_tracker: https://github.com/puntbyte/flux_card/issues

topics:
  - ui
  - widgets
  - layout
  - composition
  - flutter

screenshots:
  - description: Hero profile card preview for flux_card.
    path: screenshots/screenshot_1.jpg
  - description: Ticket cards preview showing structured card layouts.
    path: screenshots/screenshot_2.jpg
  - description: Breakout card preview with layered composition.
    path: screenshots/screenshot_3.jpg
  - description: Overlay card preview demonstrating badge-style overlays.
    path: screenshots/screenshot_4.jpg
  - description: Vertical card preview using a column layout.
    path: screenshots/screenshot_5.jpg
  - description: Horizontal card preview using a row layout.
    path: screenshots/screenshot_6.jpg

environment:
  sdk: ^3.10.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
